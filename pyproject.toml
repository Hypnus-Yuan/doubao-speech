[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "doubao-speech"
version = "0.1.0"
description = "Python client and CLI for Volcengine/ByteDance Doubao seed-tts-2.0 streaming TTS and bigmodel streaming ASR — full voice (speech-in + speech-out) toolkit."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuantao Wen", email = "hypnus.yuan@gmail.com" },
]
keywords = ["doubao", "volcengine", "bytedance", "tts", "stt", "asr", "text-to-speech", "speech-to-text", "speech-recognition", "speech", "seed-tts", "bigmodel", "chinese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1.7",
  "pyyaml>=6.0.1",
  "websockets>=14.2,<16",
]

[project.optional-dependencies]
daemon = [
  "platformdirs>=4.3",
]
mic = [
  "pyaudio>=0.2.11",
]

[project.urls]
Homepage = "https://github.com/Hypnus-Yuan/doubao-speech"
Documentation = "https://github.com/Hypnus-Yuan/doubao-speech#readme"
Repository = "https://github.com/Hypnus-Yuan/doubao-speech.git"
Issues = "https://github.com/Hypnus-Yuan/doubao-speech/issues"
Changelog = "https://github.com/Hypnus-Yuan/doubao-speech/releases"

[project.scripts]
doubao-speech = "doubao_speech.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
  "twine>=5.1",
  "types-pyyaml>=6.0.12",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/doubao_speech"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/README.zh.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "__pycache__",
  "*.py[cod]",
  ".DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # import sorting
  "UP",     # pyupgrade, respecting target-version
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
  "ARG",    # unused arguments
  "PTH",    # pathlib over os.path
  "RUF",    # Ruff-specific rules
  "T20",    # no print in library code
  "ASYNC",  # async correctness
]
ignore = [
  "E501",   # formatter owns wrapping; keep long protocol constants readable
]

[tool.ruff.lint.isort]
known-first-party = ["doubao_speech"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "T201", "ASYNC240", "RUF001"]
"benchmarks/**" = ["T201", "ASYNC240"]
"scripts/**" = ["T201", "ASYNC240"]
# Chinese-language docstrings legitimately use fullwidth punctuation.
"src/doubao_speech/__init__.py" = ["RUF002"]
"src/doubao_speech/api.py" = ["RUF002"]
# _ws_client.py is a low-level protocol engine; ruff's async-pathlib hint
# (use trio.Path / anyio.path) is aggressive for library-internal file I/O.
"src/doubao_speech/_ws_client.py" = ["ASYNC240"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=doubao_speech",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
  "integration: requires live Volcengine credentials and network access",
]

[tool.coverage.run]
branch = true
source = ["doubao_speech"]
omit = [
  # WebSocket engine only exercises under live credentials; covered by
  # the `-m integration` suite, not by unit tests.
  "src/doubao_speech/_ws_client.py",
  "src/doubao_speech/__main__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
files = ["src/doubao_speech", "tests"]
strict = true
show_error_codes = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true

# `_ws_client.py` is the original Volcengine protocol engine carried over
# from an earlier project. It's heavily typed for the happy path but not
# strict-clean. Tighten here iteratively; unblock strict mode on the
# higher-level public modules today.
[[tool.mypy.overrides]]
module = ["doubao_speech._ws_client"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["assignment", "type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["type-arg", "no-untyped-def"]
